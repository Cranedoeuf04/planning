<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning partagé</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="theme-color" content="#EDF0F5">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app shell — sticky header, tab rail, one working canvas; under 760px the tabs become a bottom bar and "+" floats */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#131B27; --muted:#5A6576; --line:#D7DDE7; --line-2:#E8ECF2;
  --accent:#2950D6; --accent-ink:#FFFFFF; --danger:#C3303A; --warn:#A86400; --ok:#1E8455; --scrim:rgba(14,20,30,.42);
  --c-cours:#2950D6; --c-job:#B26A00; --c-examen:#C3303A; --c-rendu:#7637C2; --c-revision:#0B7E71; --c-perso:#3B7A27; --c-autre:#5A6576;
  --s0:#2950D6; --s1:#0B7E71; --s2:#B26A00; --s3:#C3303A; --s4:#7637C2; --s5:#3B7A27; --s6:#B0337A; --s7:#3E6E8E;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hour:48px; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#151C26; --surface-2:#1A2330; --ink:#E4E9F0; --muted:#94A1B3; --line:#283345; --line-2:#1F2937;
    --accent:#7F9DFF; --accent-ink:#0D1218; --danger:#FF6E6E; --warn:#F0A63C; --ok:#4BC48B; --scrim:rgba(0,0,0,.6);
    --c-cours:#7F9DFF; --c-job:#F0A63C; --c-examen:#FF6E6E; --c-rendu:#B68CFF; --c-revision:#3CC8B5; --c-perso:#8ACB6A; --c-autre:#94A1B3;
    --s0:#7F9DFF; --s1:#3CC8B5; --s2:#F0A63C; --s3:#FF6E6E; --s4:#B68CFF; --s5:#8ACB6A; --s6:#F07FBE; --s7:#7FB4D6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C26; --surface-2:#1A2330; --ink:#E4E9F0; --muted:#94A1B3; --line:#283345; --line-2:#1F2937;
  --accent:#7F9DFF; --accent-ink:#0D1218; --danger:#FF6E6E; --warn:#F0A63C; --ok:#4BC48B; --scrim:rgba(0,0,0,.6);
  --c-cours:#7F9DFF; --c-job:#F0A63C; --c-examen:#FF6E6E; --c-rendu:#B68CFF; --c-revision:#3CC8B5; --c-perso:#8ACB6A; --c-autre:#94A1B3;
  --s0:#7F9DFF; --s1:#3CC8B5; --s2:#F0A63C; --s3:#FF6E6E; --s4:#B68CFF; --s5:#8ACB6A; --s6:#F07FBE; --s7:#7FB4D6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700;line-height:1.15}
h2{font-size:1.1rem;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="pending"] i,.sync[data-s="loading"] i{background:var(--warn)}
.sync[data-s="offline"] i,.sync[data-s="none"] i{background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;font-size:.9rem;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.icon{padding:8px;width:38px}
.btn svg,.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:disabled{opacity:.5;cursor:default}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow-x:auto}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:8px;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab .badge{font-family:var(--f-mono);font-size:.7rem;background:var(--danger);color:var(--surface);border-radius:999px;padding:0 6px;line-height:1.5}
.fab{display:none}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:16px;font-size:.9rem}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-head .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.navs{display:flex;gap:6px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel+.panel{margin-top:14px}
.panel h2{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.grid2>div>.panel+.panel{margin-top:0}
.note{margin:0 0 12px;font-size:.88rem;color:var(--muted)}
.note.hol{color:var(--c-perso);font-weight:500}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:.92rem}
.empty .btn{margin-top:10px}
.muted{color:var(--muted)}

/* pills */
.cat{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface));border-radius:999px;padding:2px 8px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));flex:none}
.cd{font-family:var(--f-mono);font-size:.75rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.cd.hot{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.cd.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.flag{font-size:.7rem;font-weight:600;color:var(--danger);white-space:nowrap}

/* next card */
.next{display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--cc) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 35%,var(--line));border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.next{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.next:hover{border-color:var(--cc)}
.next .when{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;color:var(--cc);white-space:nowrap}
.next .what{min-width:0}
.next .what b{display:block;font-size:1.02rem}
.next .what span{color:var(--muted);font-size:.86rem}

/* agenda */
.ag{display:flex;flex-direction:column}
.ag-item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;border:0;background:transparent;padding:10px 6px;border-top:1px solid var(--line-2);border-radius:0}
.ag-item:first-child{border-top:0}
.ag-item:hover{background:var(--surface-2)}
.ag-time{font-family:var(--f-mono);font-size:.85rem;line-height:1.3;font-variant-numeric:tabular-nums}
.ag-time span{color:var(--muted)}
.ag-body{min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:3px solid var(--cc)}
.ag-title{font-weight:600}
.ag-meta{font-size:.83rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ag-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ag-item.past{opacity:.55}
.ag-item.cancelled .ag-title{text-decoration:line-through}

/* week */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem}
.stat b{font-family:var(--f-mono);font-weight:500}
.stat.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.wk-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.wk{display:grid;grid-template-columns:46px repeat(7,minmax(104px,1fr));min-width:774px}
.wk-h{position:sticky;top:0;background:var(--surface);padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line-2);text-align:left;font-size:.8rem;color:var(--muted);z-index:2;min-height:52px;border-top:0;border-right:0}
button.wk-h{cursor:pointer}
.wk-h b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);font-weight:600;line-height:1.1}
.wk-h.today b{color:var(--accent)}
.wk-h .hol{display:block;font-size:.66rem;color:var(--c-perso);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.wk-ad{border-left:1px solid var(--line-2);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:8px}
.wk-adlabel{border-bottom:1px solid var(--line);font-size:.62rem;color:var(--muted);padding:4px;text-align:right}
.wk-times{position:relative}
.wk-times span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.wk-col{position:relative;border-left:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% var(--hour);cursor:copy}
.wk-col.ro{cursor:default}
.wk-col.is-today{background-color:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.wk-col.is-hol{background-color:color-mix(in srgb,var(--c-perso) 6%,var(--surface))}
.wk-ev{position:absolute;margin:1px 2px;border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);background:color-mix(in srgb,var(--cc) 15%,var(--surface));border-radius:6px;padding:3px 5px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:0;font-size:.74rem;line-height:1.25;color:var(--ink)}
.wk-ev:hover{background:color-mix(in srgb,var(--cc) 24%,var(--surface));z-index:3}
.wk-ev .t{font-family:var(--f-mono);font-size:.66rem;color:var(--cc)}
.wk-ev .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.wk-ev .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev.conf{box-shadow:0 0 0 2px var(--danger)}
.chipev{border:0;text-align:left;border-radius:5px;padding:2px 6px;font-size:.72rem;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mo-dow{padding:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.mo-cell{min-height:104px;border:0;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);background:transparent;text-align:left;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mo-cell:nth-child(7n+1){border-left:0}
.mo-cell:hover{background:var(--surface-2)}
.mo-cell.out{color:var(--muted);background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.mo-num{font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.mo-cell.today .mo-num{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;align-self:flex-start}
.mo-hol{font-size:.64rem;color:var(--c-perso);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-ch{display:block;font-size:.7rem;border-radius:4px;padding:1px 5px;background:color-mix(in srgb,var(--cc) 15%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mo-ch .mono{color:var(--cc);font-size:.64rem}
.mo-more{font-size:.68rem;color:var(--muted)}
.mo-list{display:flex;flex-direction:column;gap:2px;min-width:0}
.mo-dots{display:none;gap:3px;flex-wrap:wrap}
.mo-dots i{width:6px;height:6px;border-radius:50%;background:var(--cc)}

/* deadlines & tasks */
.dl-group+.dl-group{margin-top:18px}
.dl-group h3{font-family:var(--f-body);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:600}
.row .main span{font-size:.83rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dl-date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:92px;flex:none}

.taskform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.75rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line-2);padding:8px 2px}
.task:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border:1.6px solid var(--muted);border-radius:7px;background:var(--surface);display:grid;place-items:center;padding:0;margin-top:2px}
.chk svg{width:14px;height:14px;fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk svg{opacity:1;stroke:var(--surface)}
.task-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.task-main b{font-weight:600}
.task.done .task-main b{text-decoration:line-through;color:var(--muted)}
.task-main span{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prio{font-family:var(--f-mono);font-size:.7rem;color:var(--danger)}

/* job */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .k{font-size:.78rem;color:var(--muted)}
.bars svg{width:100%;height:auto;display:block}
.rate{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate input{width:110px}

/* settings */
.subj{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line-2);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.subj:first-child{border-top:0}
button.subj:hover{background:var(--surface-2)}
.subj .dot{width:12px;height:12px}
.prose{max-width:66ch;font-size:.92rem}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* people & prefs */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 12px;font-size:.84rem}
.legend .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.person{display:inline-flex;align-items:center;gap:6px}
.dot.big{width:14px;height:14px}
.prefs{display:flex;flex-direction:column;gap:14px}
.prefs select{max-width:240px}
/* shared planner */
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gate{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:24px}
.gate.wide{max-width:760px;margin-top:20px}
.gate p{margin:0}
.gate h2{font-size:1.05rem;margin-top:10px}
.gate ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.gate code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.gate a{color:var(--accent)}
.btn.big{min-height:46px;padding:10px 18px;font-size:1rem}
.btn.big svg{width:20px;height:20px}
.langpick{display:flex;gap:4px;flex-wrap:wrap}
.langpick .btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}
.filterbar .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.filterbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem}
.fchip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.seg.wrap{flex-wrap:wrap}
.by.owner{display:flex;gap:6px;align-items:center;margin:-6px 0 12px}
.taskform{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) auto}
.subj-h{font-family:var(--f-body);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 2px}
.subj-h:first-of-type{margin-top:0}
/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:540px;max-height:calc(100% - 16px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:12px}
.form fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:.83rem;cursor:pointer;background:var(--surface)}
.chip input:checked+span{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,var(--surface));color:var(--ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{position:relative}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:28px;height:28px;border-radius:50%;background:var(--sc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.err{color:var(--danger);font-size:.85rem;margin:0}
.by{font-size:.78rem;color:var(--muted);margin:0}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:4px}
.foot .r{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:80;max-width:calc(100% - 32px)}

@media (max-width:900px){ .grid2{grid-template-columns:minmax(0,1fr)} .taskform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .taskform .field:first-child{grid-column:1/-1} }
@media (max-width:760px){
  .app{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.4rem}
  .top .btn.new{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);z-index:30;justify-content:space-around;gap:0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;padding:4px 2px;font-size:.66rem;flex:1;min-width:0}
  .tab .lbl-long{display:none}
  .tab[aria-current="page"]{box-shadow:none;color:var(--accent);background:transparent}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px)}
  .fab{display:grid;place-items:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:31}
  .fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .mo-cell{min-height:58px;padding:4px}
  .mo-list,.mo-more,.mo-hol{display:none}
  .mo-dots{display:flex}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .three>:first-child{grid-column:1/-1}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .dl-date{width:74px}
}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>toStr(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return toStr(d)};
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const wd=s=>{const g=parseD(s).getDay();return g===0?7:g};
const weekStart=s=>addDays(s,1-wd(s));
const isoWeek=s=>{const d=parseD(s);const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y0)/864e5+1)/7)};
const mins=v=>{if(!v||!/^\d{1,2}:\d{2}$/.test(v))return null;const[h,m]=v.split(':').map(Number);return h*60+m};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const nowIso=()=>new Date().toISOString();

const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const easter=`${y}-${pad(mo)}-${pad(da)}`;
  return holCache[y]={[`${y}-01-01`]:'h_ny',[addDays(easter,1)]:'h_em',[`${y}-05-01`]:'h_may',[addDays(easter,39)]:'h_asc',[addDays(easter,50)]:'h_pm',[`${y}-07-21`]:'h_nat',[`${y}-08-15`]:'h_aug',[`${y}-09-27`]:'h_fwb',[`${y}-11-01`]:'h_nov1',[`${y}-11-11`]:'h_arm',[`${y}-12-25`]:'h_xmas'};
}

/* ---------- occurrences ---------- */
function occursOn(ev,d){
  if(!ev.date)return false;
  if((ev.exceptions||[]).includes(d))return false;
  if(!ev.recur||ev.recur==='once')return ev.date===d;
  const step=ev.recur==='biweekly'?14:7,diff=dayNum(d)-dayNum(ev.date);
  return diff>=0&&diff%step===0&&(!ev.until||d<=ev.until);
}
function dayItems(d,list){
  return (list||state.events.filter(visible)).filter(e=>occursOn(e,d)).map(e=>{
    if(e.allDay)return{ev:e,d,s:-1,e:-1};
    const s=mins(e.start)??480;let en=mins(e.end);if(en==null||en<=s)en=s+60;
    return{ev:e,d,s,e:en};
  }).sort((a,b)=>a.s-b.s||String(a.ev.title).localeCompare(String(b.ev.title)));
}
function conflictIds(items){
  const x=items.filter(i=>i.s>=0),out=new Set();
  for(let i=0;i<x.length;i++)for(let j=i+1;j<x.length;j++)if(x[j].s<x[i].e&&x[i].s<x[j].e){out.add(x[i].ev.id);out.add(x[j].ev.id)}
  return out;
}
function lanes(items){
  const res=new Map();let cluster=[],clEnd=-1,ends=[];
  const flush=()=>{const n=ends.length;cluster.forEach(c=>res.set(c.it,{lane:c.lane,n}));cluster=[];ends=[];clEnd=-1};
  items.filter(i=>i.s>=0).forEach(it=>{
    if(cluster.length&&it.s>=clEnd)flush();
    let l=ends.findIndex(e=>e<=it.s);if(l<0){l=ends.length;ends.push(it.e)}else ends[l]=it.e;
    cluster.push({it,lane:l});clEnd=Math.max(clEnd,it.e);
  });
  if(cluster.length)flush();return res;
}
function countdown(date){
  const n=dayNum(date)-dayNum(todayStr());
  if(n<0)return{t:t('cdLate',{n:-n}),c:'hot'};
  if(n===0)return{t:t('cdToday'),c:'hot'};
  if(n===1)return{t:t('cdTomorrow'),c:'hot'};
  return{t:t('cdN',{n}),c:n<=3?'hot':n<=7?'soon':''};
}
function deadlines(){
  const today=todayStr(),out=[];
  state.events.filter(visible).forEach(e=>{
    if(e.cat!=='examen'&&e.cat!=='rendu')return;
    if(!e.recur||e.recur==='once'){if(e.date>=today)out.push({kind:'ev',ev:e,date:e.date,time:e.allDay?'':e.start})}
    else for(let i=0;i<200;i++){const d=addDays(today,i);if(occursOn(e,d)){out.push({kind:'ev',ev:e,date:d,time:e.allDay?'':e.start});break}}
  });
  state.tasks.filter(visible).forEach(x=>{if(x.due&&!x.done)out.push({kind:'task',t:x,date:x.due,time:''})});
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
}

/* writes are applied locally at once and synced in the background, also offline */
function run(p,msgKey){if(msgKey)toast(t(msgKey));return p.then(()=>true,e=>{onWriteError(e);return false})}
function saveItem(kind,x,data,targetSpace,msgKey){
  const id=x&&x.id?x.id:newId(),from=x&&x._space,to=targetSpace||from||myPrivate();
  if(from&&from!==to){
    const b=fb.batch();b.set(colRef(to,kind).doc(id),data);b.delete(colRef(from,kind).doc(id));return run(b.commit(),msgKey);
  }
  return run(colRef(to,kind).doc(id).set(data),msgKey);
}
const delItem=(kind,x,msgKey)=>run(colRef(x._space,kind).doc(x.id).delete(),msgKey);

function stopSpaces(){unsubs.spaces.forEach(fns=>fns.forEach(f=>f()));unsubs.spaces.clear();state.evBy={};state.tkBy={};state.loadedSpaces.clear();rebuild()}

function syncSpaces(){
  const want=new Set(mySpaces());
  for(const [sid,fns] of unsubs.spaces)if(!want.has(sid)){fns.forEach(f=>f());unsubs.spaces.delete(sid);delete state.evBy[sid];delete state.tkBy[sid];state.loadedSpaces.delete(sid)}
  want.forEach(sid=>{
    if(unsubs.spaces.has(sid))return;
    const meta=snap=>{state.pending=snap.metadata.hasPendingWrites;state.fromCache=snap.metadata.fromCache};
    const err=e=>{console.warn('space',sid,e&&e.code);state.loadedSpaces.add(sid);render()};
    const a=colRef(sid,'events').onSnapshot({includeMetadataChanges:true},snap=>{state.evBy[sid]=snap.docs.map(d=>({...d.data(),id:d.id,_space:sid}));state.loadedSpaces.add(sid);meta(snap);rebuild();render()},err);
    const b=colRef(sid,'tasks').onSnapshot({includeMetadataChanges:true},snap=>{state.tkBy[sid]=snap.docs.map(d=>({...d.data(),id:d.id,_space:sid}));meta(snap);rebuild();render()},err);
    unsubs.spaces.set(sid,[a,b]);

}

function captureForm(root){
  const vals={};root.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{if(el.type!=='file')vals[el.id]=el.type==='checkbox'?el.checked:el.value});
  const a=document.activeElement;let focus=null;
  if(a&&root.contains(a)&&a.id){focus={id:a.id};try{focus.s=a.selectionStart;focus.e=a.selectionEnd}catch(e){}}
  return{vals,focus};
}
function restoreForm(root,st){
  Object.entries(st.vals).forEach(([id,v])=>{const el=root.querySelector('#'+CSS.escape(id));if(!el||el.type==='file'||el.dataset.live)return;if(el.type==='checkbox')el.checked=v;else el.value=v});
  if(st.focus){const el=root.querySelector('#'+CSS.escape(st.focus.id));if(el){el.focus();try{if(st.focus.s!=null)el.setSelectionRange(st.focus.s,st.focus.e)}catch(e){}}}

/* ----- Day ----- */
function renderJour(){
  const d=state.cursor,today=todayStr(),diff=dayNum(d)-dayNum(today);

  let h=`<section class="view-head"><div><p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(cap(fmtLong(d))+yr)}</h1></div>${navBtns()}</section>`+filterBar();
  if(hol)h+=`<p class="note hol">${esc(t('holidayNote',{n:hol}))}</p>`;
  if(diff===0)h+=nextCard();
  const agenda=items.length?`<div class="ag">${items.map(i=>agItem(i,conf,{today:diff===0})).join('')}</div>`:
    `<div class="empty">${esc(state.events.length?t('emptyDay'):t('emptyAll'))}<br><button class="btn" data-act="new-ev" data-date="${d}">${esc(t('addEvent'))}</button></div>`;
  const dueT=state.tasks.filter(visible).filter(x=>!x.done&&x.due&&(x.due===d||(diff===0&&x.due<today))).sort((a,b)=>a.due.localeCompare(b.due));

    <div class="panel"><h2>${esc(t(diff===0?'tasksToday':'tasksDay'))}</h2>${dueT.length?dueT.map(taskRow).join(''):`<p class="empty">${esc(t('noTasksDue'))}</p>`}</div>
    <div class="panel"><h2>${esc(t('nextDeadlines'))}</h2>${dls.length?dls.map(x=>{const c=countdown(x.date);return `<button class="row" data-act="open-ev" data-id="${esc(x.ev.id)}" data-date="${x.date}"><span class="main"><b>${esc(x.ev.title)}</b><span>${catPill(x.ev.cat)}${esc(fmtShort(x.date))}${x.time?' · '+esc(x.time):''}</span></span><span class="cd ${c.c}">${esc(c.t)}</span></button>`}).join(''):`<p class="empty">${esc(t('noDeadlinesAhead'))}</p>`}</div>
  </div></div>`;

function nextCard(){
  const today=todayStr(),now=nowMin(),mine=state.events.filter(e=>e.ownerUid===state.uid||e.common);
  let found=null;
  for(let k=0;k<8&&!found;k++){const d=addDays(today,k);const it=dayItems(d,mine).find(i=>i.s>=0&&(k>0||i.e>now));if(it)found={...it,k}}
  if(!found)return '';
  const ev=found.ev;let when;
  if(found.k===0){if(found.s<=now)when=t('ongoing',{t:hm(found.e)});else{const m=found.s-now;when=m<60?t('inMin',{m}):t('inHM',{h:Math.floor(m/60),m:pad(m%60)})}}
  else when=`${found.k===1?t('tomorrow'):fmtShort(found.d)} ${hm(found.s)}`;
  return `<button class="next" data-act="open-ev" data-id="${esc(ev.id)}" data-date="${found.d}" style="--cc:${evColor(ev)}"><span class="when">${esc(when)}</span><span class="what"><b>${esc(ev.title)}</b><span>${[catLabel(ev.cat),ev.location,(subj(ev.subject)||{}).name].filter(Boolean).map(esc).join(' · ')}</span></span></button>`;
}

/* ----- Week ----- */
function renderSemaine(){
  const ws=weekStart(state.cursor),today=todayStr(),days=[...Array(7)].map((_,i)=>addDays(ws,i));

  eH=Math.min(24,Math.max(eH,sH+1));
  const H=48,total=(eH-sH)*H;
  let cours=0,job=0,rev=0;per.flat().forEach(i=>{if(i.s<0||i.ev.ownerUid!==state.uid)return;const h=(i.e-i.s)/60;if(i.ev.cat==='cours')cours+=h;else if(i.ev.cat==='job')job+=h;else if(i.ev.cat==='revision')rev+=h});
  const confs=per.map(conflictIds),nConf=confs.reduce((n,s)=>n+s.size,0);

  h+=`<div class="stats"><span class="stat"><i class="dot" style="--sc:var(--c-cours)"></i>${esc(t('wkCourses'))} <b>${fmtH(cours)}</b></span><span class="stat"><i class="dot" style="--sc:var(--c-job)"></i>${esc(t('wkJob'))} <b>${fmtH(job)}</b></span><span class="stat"><i class="dot" style="--sc:var(--c-revision)"></i>${esc(t('wkRev'))} <b>${fmtH(rev)}</b></span>${nConf?`<span class="stat bad">${esc(t('wkOverlaps'))} <b>${nConf}</b></span>`:''}</div>`;
  const hasAD=per.some(l=>l.some(i=>i.s<0));

  days.forEach((d,i)=>{const hol=holiday(d);g+=`<button class="wk-h${d===today?' today':''}" data-act="goto-day" data-date="${d}">${esc(N.dow[i])}<b>${parseD(d).getDate()}</b>${hol?`<span class="hol">${esc(hol)}</span>`:''}</button>`});
  if(hasAD){g+=`<div class="wk-adlabel">${esc(t('wkAllDay'))}</div>`;per.forEach(l=>{g+=`<div class="wk-ad">${l.filter(i=>i.s<0).map(i=>`<button class="chipev" data-act="open-ev" data-id="${esc(i.ev.id)}" data-date="${i.d}" style="--cc:${evColor(i.ev)}">${esc(i.ev.title)}</button>`).join('')}</div>`})}
  g+=`<div class="wk-times" style="height:${total}px">${[...Array(eH-sH)].map((_,k)=>k?`<span style="top:${k*H}px">${pad(sH+k)}:00</span>`:'').join('')}</div>`;
  const nm=nowMin();
  days.forEach((d,di)=>{
    const Ln=lanes(per[di]),conf=confs[di];
    let col=`<div class="wk-col${d===today?' is-today':''}${holiday(d)?' is-hol':''}" data-act="slot" data-date="${d}" data-sh="${sH}" style="height:${total}px">`;

      col+=`<button class="wk-ev${conf.has(i.ev.id)?' conf':''}" data-act="open-ev" data-id="${esc(i.ev.id)}" data-date="${d}" title="${esc(i.ev.title)} ${hm(i.s)}–${hm(i.e)}" style="--cc:${evColor(i.ev)};top:${top}px;height:${ht}px;left:calc(${p.lane} * 100% / ${p.n});width:calc(100% / ${p.n} - 4px)"><span class="t">${hm(i.s)}–${hm(i.e)}</span><span class="n">${esc(i.ev.title)}</span>${ht>52?`<span class="m">${esc([who,s&&(s.code||s.name),i.ev.location].filter(Boolean).join(' · '))}</span>`:''}</button>`;

    g+=col+'</div>';
  });
  h+=`<div class="wk-wrap"><div class="wk">${g}</div></div><p class="note" style="margin-top:8px">${esc(t('wkHint'))}</p>`;

  <form class="form" id="subj-form" novalidate><fieldset ${ro?'disabled':''}>
   <div class="field"><label for="sb-name">${esc(t('name'))}</label><input type="text" id="sb-name" maxlength="80" value="${esc(s.name)}" placeholder="${esc(t('namePh'))}"></div>
   <div class="field"><label for="sb-circle">${esc(t('subjCircle'))}</label><select id="sb-circle"><option value="">${esc(t('allCircles'))}</option>${circles.map(g=>`<option value="${esc(g.id)}" ${s.circle===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><span class="note" style="margin:2px 0 0">${esc(t('subjCircleNote'))}</span></div>
   <div class="two"><div class="field"><label for="sb-code">${esc(t('code'))}</label><input type="text" id="sb-code" maxlength="16" value="${esc(s.code||'')}" placeholder="${esc(t('codePh'))}"></div><div class="field"><label for="sb-teacher">${esc(t('teacher'))}</label><input type="text" id="sb-teacher" maxlength="80" value="${esc(s.teacher||'')}"></div></div>
   <div class="field"><span class="lbl">${esc(t('color'))}</span><div class="swatches">${[...Array(8)].map((_,k)=>`<label class="sw"><input type="radio" name="sb-col" value="${k}" ${(s.color??0)%8===k?'checked':''} aria-label="${esc(t('colorN',{n:k+1}))}"><span style="--sc:var(--s${k})"></span></label>`).join('')}</div></div>
  </fieldset><p class="err" id="sb-err" hidden></p>
  ${ro?'':`<div class="foot">${isNew?'<span></span>':`<button type="button" class="btn danger" id="sb-del">${esc(t('del'))}</button>`}<div class="r"><button type="submit" class="btn primary">${esc(t('save'))}</button></div></div>`}</form>`,sh=>{
    if(ro)return;
    sh.querySelector('#subj-form').addEventListener('submit',x=>{x.preventDefault();const g=id=>sh.querySelector(id);const name=g('#sb-name').value.trim();if(!name){const er=g('#sb-err');er.textContent=t('errSubjName');er.hidden=false;return}
      const id=s.id||newId();closeModal();
      run(fb.collection('subjects').doc(id).set(stamp({...strip(s),name,code:g('#sb-code').value.trim(),teacher:g('#sb-teacher').value.trim(),circle:g('#sb-circle').value,color:+((sh.querySelector('input[name=sb-col]:checked')||{}).value||0)})),'tSubjSaved')});
    const del=sh.querySelector('#sb-del');if(del)del.addEventListener('click',()=>armDelete(del,()=>{closeModal();run(fb.collection('subjects').doc(s.id).delete(),'tSubjDeleted')}));
  });
}
function openCircle(gr){
  const isNew=!gr;gr=gr||{name:'',color:state.groups.length%8};
  modal(`<div class="sheet-head"><h2>${esc(t(isNew?'circleNew':'circleOne'))}</h2>${closeBtn()}</div>
  <form class="form" id="circle-form" novalidate>
   <div class="field"><label for="ci-name">${esc(t('name'))}</label><input type="text" id="ci-name" maxlength="40" value="${esc(gr.name)}"></div>
   <div class="field"><span class="lbl">${esc(t('color'))}</span><div class="swatches">${[...Array(8)].map((_,k)=>`<label class="sw"><input type="radio" name="ci-col" value="${k}" ${(gr.color??0)%8===k?'checked':''} aria-label="${esc(t('colorN',{n:k+1}))}"><span style="--sc:var(--s${k})"></span></label>`).join('')}</div></div>
   ${isNew?'':`<p class="by">${esc(t('circleDelWarn'))}</p>`}<p class="err" id="ci-err" hidden></p>
   <div class="foot">${isNew?'<span></span>':`<button type="button" class="btn danger" id="ci-del">${esc(t('del'))}</button>`}<div class="r"><button type="submit" class="btn primary">${esc(t('save'))}</button></div></div></form>`,sh=>{
    sh.querySelector('#circle-form').addEventListener('submit',async x=>{x.preventDefault();const name=sh.querySelector('#ci-name').value.trim();if(!name){const er=sh.querySelector('#ci-err');er.textContent=t('errSubjName');er.hidden=false;return}
      const id=gr.id||newId(),color=+((sh.querySelector('input[name=ci-col]:checked')||{}).value||0);closeModal();
      const b=fb.batch();b.set(fb.collection('groups').doc(id),{name,color,updatedAt:nowIso()},{merge:true});
      if(isNew){const me=state.members.find(mm=>mm.id===state.email);b.set(fb.collection('members').doc(state.email),{groups:[...new Set([...((me&&me.groups)||[]),id])]},{merge:true})}
      run(b.commit(),'tCircleSaved')});
    const del=sh.querySelector('#ci-del');if(del)del.addEventListener('click',()=>armDelete(del,()=>{closeModal();const b=fb.batch();b.delete(fb.collection('groups').doc(gr.id));state.members.filter(mm=>(mm.groups||[]).includes(gr.id)).forEach(mm=>b.update(fb.collection('members').doc(mm.id),{groups:(mm.groups||[]).filter(g=>g!==gr.id)}));run(b.commit(),'tCircleDeleted')}));
  });
}
function openMember(mm){
  const isNew=!mm;mm=mm||{id:'',name:'',groups:[]};
  modal(`<div class="sheet-head"><h2>${esc(t(isNew?'memberNew':'memberOne'))}</h2>${closeBtn()}</div>
  <form class="form" id="member-form" novalidate>
   <div class="field"><label for="mb-email">${esc(t('memberEmail'))}</label><input type="email" id="mb-email" value="${esc(mm.id)}" ${isNew?'':'disabled'} autocomplete="off" placeholder="prenom.nom@gmail.com"></div>
   <div class="field"><label for="mb-name">${esc(t('memberName'))}</label><input type="text" id="mb-name" maxlength="60" value="${esc(mm.name||'')}"></div>
   <div class="field"><span class="lbl">${esc(t('memberGroups'))}</span><div class="chips">${state.groups.map(g=>`<label class="chip" style="--cc:${spaceColor(g.id)}"><input type="checkbox" name="mb-g" value="${esc(g.id)}" ${(mm.groups||[]).includes(g.id)?'checked':''}><span>${esc(g.name)}</span></label>`).join('')}</div></div>
   <p class="err" id="mb-err" hidden></p>
   <div class="foot">${isNew||mm.id===state.email?'<span></span>':`<button type="button" class="btn danger" id="mb-del">${esc(t('remove'))}</button>`}<div class="r"><button type="submit" class="btn primary">${esc(t('save'))}</button></div></div></form>`,sh=>{
    sh.querySelector('#member-form').addEventListener('submit',x=>{x.preventDefault();const email=(isNew?sh.querySelector('#mb-email').value:mm.id).trim().toLowerCase();
      if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)){const er=sh.querySelector('#mb-err');er.textContent=t('errEmail');er.hidden=false;return}
      const groups=[...sh.querySelectorAll('input[name=mb-g]:checked')].map(i=>i.value);closeModal();
      run(fb.collection('members').doc(email).set({name:sh.querySelector('#mb-name').value.trim(),groups,addedAt:mm.addedAt||nowIso()},{merge:true}),'tMemberSaved')});
    const del=sh.querySelector('#mb-del');if(del)del.addEventListener('click',()=>armDelete(del,()=>{closeModal();run(fb.collection('members').doc(mm.id).delete(),'tMemberRemoved')}));
  });
}

/* ---------- export / import ---------- */
function download(filename,data,type){
  try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){toast(t('eDlFail'))}
}
function exportJson(){download(`${t('fileBackup')}-${todayStr()}.json`,JSON.stringify({app:'planning',version:2,exportedAt:nowIso(),events:state.events.map(x=>({...strip(x),id:x.id})),tasks:state.tasks.map(x=>({...strip(x),id:x.id})),subjects:state.subjects},null,2),'application/json')}
function exportCsv(){
  const q=v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[t('csv').split('|')];
  state.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(e=>rows.push([e.title,catLabel(e.cat),(subj(e.subject)||{}).name||'',e.date,e.start,e.end,t(e.allDay?'yes':'no'),t({weekly:'weekly',biweekly:'biweekly'}[e.recur]||'once'),e.until,e.location,e.notes]));
  download(`${t('fileCsv')}-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv');
}
function readImport(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const ok=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id)):[];
      state.importData={events:ok(d.events),tasks:ok(d.tasks),subjects:ok(d.subjects)};
      if(!state.importData.events.length&&!state.importData.tasks.length&&!state.importData.subjects.length){state.importData=null;toast(t('eImpEmpty'))}
      render()}catch(e){state.importData=null;toast(t('eImpBad'))}};
  r.readAsText(file);
}
async function runImport(){
  const d=state.importData;if(!d)return;const target=($('#import-space')||{}).value||myPrivate();
  state.importData=null;render();toast(t('tImporting'));
  const clean=x=>{const c=strip(x);delete c.by;delete c.source;return{...c,ownerUid:state.uid,editedBy:state.uid,updatedAt:nowIso(),createdAt:c.createdAt||nowIso()}};
  const writes=[...d.subjects.map(x=>[fb.collection('subjects').doc(x.id),{...clean(x),circle:x.circle||(target!==myPrivate()?target:'')}]),...d.events.map(x=>[colRef(target,'events').doc(x.id),{...clean(x),common:false}]),...d.tasks.map(x=>[colRef(target,'tasks').doc(x.id),{...clean(x),common:false}])];
  let n=0;
  try{for(let i=0;i<writes.length;i+=400){const b=fb.batch();writes.slice(i,i+400).forEach(([ref,data])=>b.set(ref,data));await b.commit();n+=Math.min(400,writes.length-i)}toast(t('tImported',{n}))}
  catch(e){onWriteError(e);toast(t('tImportStop',{n}))}
}

/* ---------- events ---------- */
function goTab(x){state.tab=x;remember();try{history.replaceState(null,'','#'+x)}catch(e){}window.scrollTo(0,0);render()}
function shift(dir){
  if(state.tab==='jour')state.cursor=addDays(state.cursor,dir);
  else if(state.tab==='semaine')state.cursor=addDays(state.cursor,7*dir);
  else{const d=parseD(state.cursor);d.setDate(1);d.setMonth(d.getMonth()+dir);state.cursor=toStr(d)}
  render();
}
const findEv=id=>state.events.find(x=>x.id===id),findTask=id=>state.tasks.find(x=>x.id===id);
document.addEventListener('click',e=>{
  const ov=$('#overlay');if(e.target===ov){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const app=state.phase==='app';
  switch(el.dataset.act){
    case 'signin':signIn();break;
    case 'signout':auth&&auth.signOut();break;
    case 'init':initPlanner();break;
    case 'lang':savePrefs({lang:el.dataset.v});break;
    case 'tab':if(app)goTab(el.dataset.tab);break;
    case 'prev':shift(-1);break;case 'next':shift(1);break;
    case 'today':state.cursor=todayStr();render();break;
    case 'close':closeModal();break;
    case 'goto-day':state.cursor=el.dataset.date;goTab('jour');break;
    case 'new-ev':if(app)openEditor(null,null,{date:el.dataset.date,cat:el.dataset.cat});break;
    case 'open-ev':{const ev=findEv(el.dataset.id);if(ev)openEditor(ev,el.dataset.date);break}
    case 'slot':{const r=el.getBoundingClientRect(),sh=+el.dataset.sh,m=Math.max(0,Math.round(((e.clientY-r.top)/48*60)/30)*30)+sh*60;openEditor(null,null,{date:el.dataset.date,start:hm(Math.min(m,1380))});break}
    case 'toggle-task':{const tk=findTask(el.dataset.id);if(tk&&canEdit(tk)){const done=!tk.done;saveItem('tasks',tk,stamp({...strip(tk),done,doneAt:done?nowIso():''}),null,done?'tTaskDone':'tTaskReopened')}break}
    case 'edit-task':{const tk=findTask(el.dataset.id);if(tk)openTask(tk);break}
    case 'tfilter':state.taskFilter=el.dataset.v;remember();render();break;
    case 'toggle-spaces':case 'toggle-people':{const kind=el.dataset.act.slice(7),set=state.hidden[kind],id=el.dataset.id;set.has(id)?set.delete(id):set.add(id);saveHidden();render();break}
    case 'colorby':savePrefs({colorBy:el.dataset.v});break;
    case 'new-subj':openSubject(null);break;
    case 'edit-subj':{const s=subj(el.dataset.id);if(s)openSubject(s);break}
    case 'new-circle':if(state.isAdmin)openCircle(null);break;
    case 'edit-circle':if(state.isAdmin){const g=group(el.dataset.id);if(g)openCircle(g)}break;
    case 'new-member':if(state.isAdmin)openMember(null);break;
    case 'edit-member':if(state.isAdmin){const mm=state.members.find(x=>x.id===el.dataset.id);if(mm)openMember(mm)}break;
    case 'copy-link':{const url=location.href.split('#')[0];try{navigator.clipboard.writeText(url).then(()=>toast(t('tCopied')),()=>toast(url))}catch(err){toast(url)}break}
    case 'export-json':exportJson();break;
    case 'export-csv':exportCsv();break;
    case 'import-go':runImport();break;
    case 'import-cancel':state.importData=null;{const f=$('#import-file');if(f)f.value=''}render();break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='task-form')return;e.preventDefault();
  const title=$('#t-title').value.trim();if(!title){$('#t-title').focus();return}
  const target=$('#t-space').value||myPrivate();
  const doc=stamp({title,subject:$('#t-subj').value,due:$('#t-due').value||'',prio:+$('#t-prio').value,notes:'',done:false,doneAt:'',common:false,createdAt:nowIso(),ownerUid:state.uid});
  $('#t-title').value='';$('#t-due').value='';$('#t-prio').value='1';
  saveItem('tasks',null,doc,target,'tTaskAdded');
});
document.addEventListener('change',e=>{
  const el=e.target,id=el.id;
  if(id==='t-filter-subj'){state.taskSubj=el.value;render()}
  else if(id==='t-space'){const ss=$('#t-subj');if(ss)refillSubj(ss,el.value)}
  else if(id==='pref-lang')savePrefs({lang:el.value});
  else if(id==='job-rate'){const v=parseFloat(String(el.value).replace(',','.'));saveUser({hourlyRate:isFinite(v)&&v>0?Math.round(v*100)/100:null},'tRate')}
  else if(id==='set-start'||id==='set-end')saveUser({dayStart:+$('#set-start').value,dayEnd:+$('#set-end').value},'tGrid');
  else if(el.name==='my-col')run(fb.collection('profiles').doc(state.uid).set({color:+el.value},{merge:true}));
  else if(id==='import-file'&&el.files&&el.files[0])readImport(el.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal()});
window.addEventListener('online',()=>{state.offline=false;updateSync()});
window.addEventListener('offline',()=>{state.offline=true;updateSync()});
setInterval(()=>{if(state.phase==='app'&&['jour','semaine'].includes(state.tab)&&$('#overlay').hidden)render()},60000);

render();
boot();
})();
</script>
